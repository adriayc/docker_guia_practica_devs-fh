services:
  app:
    # image: adriayc/teslo-shop:1.0.0 # Imagen desde el Hub
    image: adriayc/teslo-shop:1.1.0 # Imagen desde el Hub
    container_name: teslo-app
    # Comentar para la database de Digital Ocean
    # depends_on:
    #   - db
    restart: always
    ports:
      - ${PORT}:${PORT}
    environment:
      APP_VERSION: ${APP_VERSION}
      STAGE: ${STAGE}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      PORT: ${PORT}
      HOST_API: ${HOST_API}
      JWT_SECRET: ${JWT_SECRET}

